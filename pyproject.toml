[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portscan"
version = "1.0.0"
description = "Multithreaded TCP connect port scanner with banner grabbing"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ernest Kosmatko" }]
keywords = ["security", "pentest", "port-scanner", "networking"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
portscan = "portscan.cli:main"

[tool.setuptools.packages.find]
include = ["portscan*"]
